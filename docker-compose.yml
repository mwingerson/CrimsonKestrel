services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: crimson_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    container_name: crimson_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-crimsonkestrel123}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-crimson_kestrel}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-telemetry}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-crimson_secret_token_2026}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

  telemetry_daemon:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: crimson_daemon
    restart: unless-stopped
    command: >
      python3 gateway/crimson_kestrel_daemon.py
        --host mosquitto
        --port 1883
        --outdir /app/data
        --influx-url http://influxdb:8086
        --influx-token ${INFLUXDB_TOKEN:-crimson_secret_token_2026}
        --influx-org ${INFLUXDB_ORG:-crimson_kestrel}
        --influx-bucket ${INFLUXDB_BUCKET:-telemetry}
    volumes:
      - ./data:/app/data
    depends_on:
      - mosquitto
      - influxdb

  grafana:
    image: grafana/grafana-oss:10.2.0
    container_name: crimson_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    user: "472:472"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-crimsonkestrel123}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - INFLUXDB_ORG=${INFLUXDB_ORG:-crimson_kestrel}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-telemetry}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-crimson_secret_token_2026}
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:

apiVersion: 1

providers:
  - name: 'CrimsonKestrel Weather Station'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/grafana_dashboard.json
      foldersFromFilesStructure: false

